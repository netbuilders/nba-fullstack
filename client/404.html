<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Página no encontrada en NetBuilders." />
  <title>Página no encontrada | NetBuilders</title>
  <meta name="robots" content="noindex" />

  <!-- Tema: antes de que pinte el CSS, aplica la preferencia guardada (localStorage o cookie) o la del sistema.
       Script externo (public/theme-init.js) para cumplir la CSP de helmet (sin inline) -->
  <script src="/theme-init.js"></script>

  <!-- Google Fonts: Expletus Sans (display), Inter (cuerpo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Expletus+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="bg-decoration">
    <div class="glow glow-blue"></div>
    <div class="glow glow-yellow"></div>
    <div class="grid-overlay"></div>
  </div>

  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo-link" href="/" aria-label="NetBuilders – Inicio">
        <img src="/logo_prueba_fondo_oscuro_expletus.png" alt="NetBuilders" class="header-logo logo-dark" />
        <img src="/logo_prueba_fondo_claro_expletus.svg" alt="NetBuilders" class="header-logo logo-light" />
      </a>

      <nav class="nav" id="site-nav" aria-label="Navegación principal">
        <a class="nav-link" href="/" data-path="/">Inicio</a>
        <a class="nav-link" href="/acerca-de" data-path="/acerca-de">Acerca de</a>
        <a class="nav-link" href="/contacto" data-path="/contacto">Contacto</a>
      </nav>

      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="site-main" id="main">
    <div class="container">
      <section class="glassmorphism not-found">
        <p class="not-found-code" aria-hidden="true">404</p>
        <h1 class="headline">Esta página <span class="accent-text">se nos enredó</span></h1>
        <p class="description">
          La página que buscas no existe o se movió de sitio. Pero no te preocupes: la red sigue en pie.
        </p>
        <div class="cta-row">
          <a class="btn" href="/">Volver al inicio</a>
          <a class="btn btn-ghost" href="/contacto">Reportarlo</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; <span data-year>2026</span> <strong>NetBuilders</strong>. Todos los derechos reservados.</p>
      <nav class="footer-nav" aria-label="Enlaces de pie de página">
        <a href="/">Inicio</a>
        <a href="/acerca-de">Acerca de</a>
        <a href="/contacto">Contacto</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
