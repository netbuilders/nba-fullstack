<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Estamos enredando, pronto volvemos - Netbuilders" />
  <title>Estamos enredando, pronto volvemos | Netbuilders</title>

  <!-- Google Fonts: Outfit e Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="bg-decoration">
    <div class="glow glow-red"></div>
    <div class="glow glow-yellow"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="container">
    <div class="card glassmorphism">
      <header class="logo-wrapper">
        <img src="/logo_2020.svg" alt="Netbuilders Logo" class="brand-logo" />
      </header>

      <section class="content">
        <div class="status-badge">
          <span class="pulse-dot"></span>
          <span class="status-text">En construcción</span>
        </div>

        <h1 class="headline">Estamos enredando,<br><span class="accent-text">pronto volvemos</span></h1>

        <p class="description">
          Estamos trabajando en las tripas de la red para ofrecerte una experiencia renovada. Volveremos a estar disponibles muy pronto.
        </p>

        <div class="divider">
          <span class="divider-line"></span>
          <span class="divider-icon">⚡</span>
          <span class="divider-line"></span>
        </div>
      </section>

      <footer class="card-footer">
        <p>&copy; 2026 <strong>Netbuilders</strong>. Todos los derechos reservados.</p>
      </footer>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
